# End-to-end scenarios for scripts/19_run_scenarios.py (phase 10 Part D).
#
# A scenario names a customer (through a selector), the messages, and a `kind`. The kind decides what must be true, and the runner works the
# expected decision out of the DATA with the same oracle as tests/test_tools_oracle.py (an independent calculation from the CSV files),
# never from an answer typed here. If the data no longer fits a scenario (for example the item is no longer late), the runner reports
# "precondition failed" instead of passing quietly. Where a scenario is about wording, only facts are checked: amounts, dates, names and
# addresses in the reply must come from this turn's tool results.
#
# select:    how the customer and item are found. "persona:<label>" uses app/personas.toml; the others are searches over the data (see the runner).
# messages:  what the customer types, in order. {product}, {order_id} and {item_id} are filled in from the selected item.
# reason:    the return reason used by the oracle (default "damaged").

[[scenario]]
id = "S01"
title = "Return allowed, then confirmed (the last eligible day)"
kind = "return_allowed"
select = "persona:Last eligible day"
reason = "changed_mind"
messages = ["I want to return the {product} in order {order_id} because I changed my mind.", "Yes, please go ahead."]

[[scenario]]
id = "S02"
title = "Return allowed for a delivered, prepaid, approval-free item"
kind = "return_allowed"
select = "eligible_prepaid"
messages = ["The {product} from order {order_id} arrived damaged. I want to return it for a refund.", "Yes, go ahead."]

[[scenario]]
id = "S03"
title = "Return one day past the window is refused and goes to a reviewer"
kind = "return_late"
select = "persona:One day too late"
reason = "defective"
messages = ["The {product} in order {order_id} is defective. I want a replacement."]

[[scenario]]
id = "S04"
title = "Return over the amount limit goes to approval, not to the database"
kind = "return_needs_approval"
select = "persona:Needs a manager"
messages = ["My {product} in order {order_id} arrived damaged. I want a replacement.", "Yes, please."]

[[scenario]]
id = "S05"
