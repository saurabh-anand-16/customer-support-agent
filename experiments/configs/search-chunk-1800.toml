# Search-only experiment: a new index is built in memory; the real index is not touched.
# Note: the score thresholds were tuned for chunk size 1200, so "unanswerable refused" may move for a reason that is not about quality.
name = "search-chunk-1800"
note = "Chunk size 1800 instead of 1200"
checks = ["search"]
cost_limit_usd = 0.10

[override.rag.chunking]
max_chars = 1800