<svg viewBox="0 0 940 560" width="100%" role="img" aria-label="How the project fits together: the app calls the agent; the agent uses orders, policy, people, records and the OpenAI models; the offline evaluation scores it. Dashed boxes are optional or run by hand." font-family="Inter, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><title>How the project fits together: the app calls the agent; the agent uses orders, policy, people, records and the OpenAI models; the offline evaluation scores it. Dashed boxes are optional or run by hand.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F6470"/></marker></defs><rect width="940" height="560" fill="#FFFFFF"/><rect x="20" y="112" width="290" height="152" rx="12" fill="#F1F8F6" stroke="#DAD8D0"/><text x="32" y="128" font-size="11" font-weight="600" letter-spacing="0.8" fill="#5F6470">AGENT</text><rect x="20" y="330" width="140" height="144" rx="12" fill="#F7F7F4" stroke="#DAD8D0"/><text x="32" y="346" font-size="11" font-weight="600" letter-spacing="0.8" fill="#5F6470">ORDERS</text><rect x="170" y="330" width="140" height="144" rx="12" fill="#F7F7F4" stroke="#DAD8D0"/><text x="182" y="346" font-size="11" font-weight="600" letter-spacing="0.8" fill="#5F6470">POLICY</text><rect x="330" y="112" width="300" height="164" rx="12" fill="#F7F7F4" stroke="#DAD8D0"/><text x="342" y="128" font-size="11" font-weight="600" letter-spacing="0.8" fill="#5F6470">PEOPLE</text><rect x="650" y="330" width="280" height="144" rx="12" fill="#F7F7F4" stroke="#DAD8D0"/><text x="662" y="346" font-size="11" font-weight="600" letter-spacing="0.8" fill="#5F6470">RECORDS</text><rect x="20" y="30" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="80.0" y="51" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181D">Home</text><text x="80.0" y="68" text-anchor="middle" font-size="11.5" fill="#5F6470">Sign in</text><rect x="160" y="30" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="240.0" y="51" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181D">Customer chat</text><text x="240.0" y="68" text-anchor="middle" font-size="11.5" fill="#5F6470">Chat and confirm card</text><rect x="340" y="30" width="290" height="50" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="485.0" y="51" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181D">Manager queue</text><text x="485.0" y="68" text-anchor="middle" font-size="11.5" fill="#5F6470">Approve, decline, chat</text><rect x="650" y="30" width="280" height="50" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="790.0" y="51" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181D">Developer trace</text><text x="790.0" y="68" text-anchor="middle" font-size="11.5" fill="#5F6470">What the agent did</text><rect x="30" y="140" width="72" height="44" rx="8" fill="#E3F1EE" stroke="#0E7C6B"/><text x="66.0" y="166.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Session</text><rect x="112" y="140" width="72" height="44" rx="8" fill="#E3F1EE" stroke="#0E7C6B"/><text x="148.0" y="166.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Router</text><rect x="194" y="140" width="106" height="44" rx="8" fill="#E3F1EE" stroke="#0E7C6B"/><text x="247.0" y="166.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Seven lanes</text><rect x="30" y="210" width="110" height="44" rx="8" fill="#E3F1EE" stroke="#0E7C6B"/><text x="85.0" y="236.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Confirm step</text><rect x="170" y="210" width="130" height="44" rx="8" fill="#E3F1EE" stroke="#0E7C6B"/><text x="235.0" y="236.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Answer check</text><rect x="30" y="356" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="90.0" y="382.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Tools and eligibility</text><rect x="30" y="420" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="90.0" y="446.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Database</text><rect x="180" y="356" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="240.0" y="382.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Policy search</text><rect x="180" y="420" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="240.0" y="446.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Policy pages</text><rect x="345" y="136" width="270" height="36" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="480.0" y="158.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Review queue</text><rect x="345" y="182" width="270" height="36" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="480.0" y="204.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Manager decision</text><rect x="345" y="228" width="270" height="36" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="480.0" y="250.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Manager live chat</text><rect x="660" y="356" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="790.0" y="382.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Trace file</text><rect x="660" y="420" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#8E9097" stroke-dasharray="5 4"/><text x="790.0" y="446.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16181D">Langfuse copy (optional)</text><rect x="340" y="350" width="290" height="50" rx="8" fill="#FFFFFF" stroke="#8E9097"/><text x="485.0" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181D">OpenAI models</text><text x="485.0" y="388" text-anchor="middle" font-size="11.5" fill="#5F6470">chat model and embeddings</text><rect x="340" y="490" width="290" height="50" rx="8" fill="#FFFFFF" stroke="#8E9097" stroke-dasharray="5 4"/><text x="485.0" y="511" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181D">Offline evaluation</text><text x="485.0" y="528" text-anchor="middle" font-size="11.5" fill="#5F6470">scores the agent and search</text><path d="M140 55 L160 55" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M230 80 L230 112" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><text x="238" y="100" font-size="11" fill="#5F6470">calls the agent</text><path d="M102 162 L112 162" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M184 162 L194 162" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M247 184 L247 197 L85 197 L85 210" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M140 232 L170 232" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M480 80 L480 136" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><text x="488" y="112" font-size="11" fill="#5F6470">approve or decline</text><path d="M870 80 L870 330" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><text x="878" y="200" font-size="11" fill="#5F6470">reads</text><path d="M310 154 L345 154" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M480 172 L480 182" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M480 218 L480 228" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M85 264 L85 330" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><text x="93" y="300" font-size="11" fill="#5F6470">tools</text><path d="M240 264 L240 330" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><text x="248" y="300" font-size="11" fill="#5F6470">search</text><path d="M90 400 L90 420" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M240 400 L240 420" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M285 264 L285 312 L700 312 L700 330" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><text x="460" y="306" font-size="11" fill="#5F6470">writes each turn</text><path d="M790 400 L790 420" fill="none" stroke="#5F6470" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M310 246 L325 246 L325 362 L340 362" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M300 388 L340 388" fill="none" stroke="#5F6470" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M340 515 L8 515 L8 200 L20 200" fill="none" stroke="#5F6470" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/></svg>