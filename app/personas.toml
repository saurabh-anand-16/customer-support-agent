# The customers the Home page offers (phase 7). Only an id and words live here.
# No amount, item name, date or "days left" is written in this file: the app reads those from the database when it shows them.
# An optional item_id names the story item. It is only an id: the card and the chat header look the item up live (name, price, status, day count).
# Why each customer was picked is in the phase 7 build report (found with the eligibility logic, not with the test-only column).

[[persona]]
customer_id = "C0076"
