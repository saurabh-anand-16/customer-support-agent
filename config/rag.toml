# Settings for policy search (phase 3). Every tunable value lives here, not in code.
# Secrets (API keys) never go in this file: they stay in .env.
#
# Choose a profile with the RAG_PROFILE environment variable or by passing a name to
# load_config(). A profile overrides only the keys it lists; everything else comes from
# the base sections below.
#
# Settings that shape the index (sources, chunking, metadata, text, embedding model and
# dimensions) are hashed into the "index fingerprint". Search-only settings are not.

default_profile = "baseline_bm25"

[sources]
policy_dir = "policy"                       # relative to the project root
include_glob = "*.md"
exclude_files = ["README.md", "CHANGES.md"] # folder files, not policy pages
readme_file = "README.md"                   # lists page types and the copy date
copy_date_pattern = 'copied on (\d{4}-\d{2}-\d{2})'
page_type_heading_level = 3                 # "###" headings in the README name the page types
# Pages that describe cases outside this agent's scope (our judgement, not Amazon's).
out_of_scope_files = [
  "a-to-z-guarantee.md",
  "third-party-seller-returns.md",
  "return-a-gift.md",
  "send-a-gift-receipt.md",
]

[chunking]
strategy = "heading"            # "heading" or "fixed"
max_chars = 1200
overlap_chars = 0
include_heading_in_text = true  # heading: repeat the section heading at the top of later parts
heading_levels = [1, 2, 3]      # heading: which "#" levels start a new section
merge_empty_headings = true     # heading: a heading with no body, followed by another heading, joins the next chunk
table_handling = "split_rows"   # "keep_whole" (a long table stays one chunk) or "split_rows" (cut between rows, header repeated)

[metadata]
# Columns written for every chunk, in this order. chunk_id and text are required.
fields = [
  "chunk_id", "source_file", "page_title", "heading_path", "heading_level",
  "part_index", "text", "char_count", "copied_on", "in_scope", "page_type",
]
heading_path_separator = " > "
export_path = "data/clean/policy_chunks.csv"   # written by scripts/05_chunk_policy.py (not part of the fingerprint)

[text]
remove_toc = true
toc_label = "**Table of Contents**"
toc_item_pattern = '^\s*[-*]\s+\[.*\]\(#[^)]*\)\s*$'
collapse_blank_lines = true     # after removing the contents list, keep at most one blank line in a row

[embedding]
# Two providers are built. Switch between them by changing "provider" and "model" only:
#   provider = "openai"   model = "text-embedding-3-small"   (needs OPENAI_API_KEY; the default)
#   provider = "local"    model = "all-MiniLM-L6-v2"          (runs on this computer; needs sentence-transformers)
# dimensions: 0 means "the model's own size". A positive number is requested from OpenAI and
# checked against what the local model returns.
provider = "openai"
model = "text-embedding-3-small"
dimensions = 0
batch_size = 32
normalize = true
query_prefix = ""               # text put in front of a search query before it is embedded (some models want one)
cache_path = "data/rag/embedding_cache.jsonl"   # vectors by model + text hash, so a rebuild embeds only what changed; "" = no cache
api_key_env = "OPENAI_API_KEY"  # name of the variable holding the key. The key itself lives in .env only
env_file = ".env"               # read for that variable when it is not already set in the environment

[store]
kind = "chroma"                 # "chroma" (on disk) or "memory" (used by tests)
path = "data/rag/chroma"
collection = "policy_chunks"
distance = "cosine"             # "cosine", "ip" or "l2"
meta_path = "data/rag/index_meta.json"   # the index fingerprint and build details, as JSON

[retrieval]
strategy = "bm25"               # "bm25", "vector" or "hybrid"
top_k = 5                       # results returned to the caller (search_policy can override it)
candidate_k = 20                # how many each retriever passes on
bm25_k1 = 1.5
bm25_b = 0.75
bm25_stem = true
token_pattern = '[a-z0-9]+'     # what counts as a word (text is lower-cased first)
# Words that never count as a meaningful query word. A question made only of these finds nothing.
stopwords = [
  "a", "an", "the", "and", "or", "but", "of", "to", "in", "on", "at", "for", "from", "by", "with", "about",
  "is", "are", "was", "were", "be", "been", "am", "do", "does", "did", "can", "could", "will", "would",
  "should", "may", "might", "i", "me", "my", "we", "our", "you", "your", "it", "its", "this", "that",
  "these", "those", "what", "which", "who", "whom", "when", "where", "why", "how", "if", "then", "so",
  "there", "have", "has", "had", "not", "no", "as", "any", "some",
]
page_types = []                 # e.g. ["Core policies"] to search only those README sections; empty = all

[fusion]
method = "rrf"                  # "rrf", "weighted" or "none" (none is for bm25 and vector alone)
rrf_k = 60                      # rrf: score = sum of 1 / (rrf_k + rank)
weight_bm25 = 1.0               # weighted: scores are scaled to 0-1 per list, then weighted
weight_vector = 1.0

[rerank]
method = "none"                 # "none", "cross_encoder" or "llm"
candidates = 20                 # how many fused results go in
top_n = 5                       # how many come out (the caller's top_k can cut further)
cross_encoder_model = "cross-encoder/ms-marco-MiniLM-L-6-v2"   # needs sentence-transformers
llm_model = "gpt-4o-mini"       # an OpenAI chat model; uses the key named in [embedding].api_key_env
llm_max_chars = 800             # each passage is cut to this length in the prompt

[no_match]
# PLACEHOLDERS. These numbers were set by eye from six sample questions (phase 3c): related ones
# scored 5.2 or more (bm25) and 0.50 or more (vector), unrelated ones 4.3 or less and 0.25 or less.
# Phase 3d calibrates them against a labelled question set. Do not treat them as tuned.
bm25_min_score = 5.0            # bm25: the best score must reach this, or nothing counts as an answer
vector_min_score = 0.35         # vector: the best similarity must reach this
hybrid_require = "any"          # hybrid: "any" or "all" of the two rules above must pass
min_hits = 1                    # fewer results than this counts as no match
note = "The policy pages do not cover this."

[citations]
format = "{heading_path} ({source_file})"
show_copied_on = true
copied_on_suffix = ", copied {copied_on}"

# Named presets. Each table below overrides keys in the base sections above.
[profiles.baseline_bm25.retrieval]
strategy = "bm25"
[profiles.baseline_bm25.fusion]
method = "none"
[profiles.baseline_bm25.rerank]
method = "none"

[profiles.vector_only.retrieval]
strategy = "vector"
[profiles.vector_only.fusion]
method = "none"
[profiles.vector_only.rerank]
method = "none"

[profiles.hybrid.retrieval]
strategy = "hybrid"
[profiles.hybrid.fusion]
method = "rrf"
[profiles.hybrid.rerank]
method = "none"

[profiles.hybrid_cross_encoder.retrieval]
strategy = "hybrid"
[profiles.hybrid_cross_encoder.fusion]
method = "rrf"
[profiles.hybrid_cross_encoder.rerank]
method = "cross_encoder"

[profiles.hybrid_llm_rerank.retrieval]
strategy = "hybrid"
[profiles.hybrid_llm_rerank.fusion]
method = "rrf"
[profiles.hybrid_llm_rerank.rerank]
method = "llm"
